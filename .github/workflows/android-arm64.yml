
name: Build VRCraft 360 (Android ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VRCraft 360 ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install NDK and CMake
      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      # 5. Verify Android build tools
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          sdkmanager --version

          test -f "$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      # 6. Configure ARM64 build
      - name: Configure ARM64 build
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"

          "$CMAKE" -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      # 7. Build VRCraft
      - name: Build LeviLauncher package
        run: |
          cmake --build build \
            --target levi_package \
            --parallel 2

      # 8. Verify package exists
      - name: Verify Levi package
        run: |
          find build -type f -name "*.levipack" -print
          test -n "$(find build -type f -name '*.levipack' -print -quit)"

      # 9. Upload build artifact
      - name: Upload VRCraft 360
        uses: actions/upload-artifact@v4
        with:
          name: VRCraft360-Android-ARM64
          path: build/**/*.levipack
          if-no-files-found: error
          retention-days: 14
