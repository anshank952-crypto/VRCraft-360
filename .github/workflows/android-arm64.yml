name: Build VRCraft 360 (Android ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Configure ARM64 build
        run: |
          NDK="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build LeviLauncher package
        run: cmake --build build --target levi_package --parallel 2
      - name: Upload .levipack artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRCraft360-arm64-v8a-levipack
          path: build/*.levipack
          if-no-files-found: error
          retention-days: 14
